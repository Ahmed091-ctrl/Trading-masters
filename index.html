<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alkali Intel | Hybrid Moon Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap');
        body { background-color: #050505; color: #eee; font-family: 'JetBrains Mono', monospace; }
        .terminal-box { background: #0c0c0c; border: 1px solid #222; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .neon-text { color: #fbbf24; text-shadow: 0 0 10px rgba(251, 191, 36, 0.3); }
        .status-pill { font-size: 8px; padding: 2px 8px; border-radius: 10px; font-weight: 900; letter-spacing: 1px; }
        .btn-glow:active { transform: scale(0.96); box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); }
    </style>
</head>
<body class="p-4 flex flex-col items-center min-h-screen pb-24">

    <header class="w-full max-w-md flex justify-between items-end py-10 px-2">
        <div>
            <h1 class="text-2xl font-extrabold tracking-tighter neon-text italic">ALKALI<span class="text-white">INTEL</span></h1>
            <p class="text-[8px] text-gray-600 uppercase tracking-widest mt-1">Multi-Chain Hybrid Scanner v4.0</p>
        </div>
        <div class="status-pill bg-green-500/10 text-green-500 border border-green-500/20">HYBRID_LIVE</div>
    </header>

    <div class="w-full max-w-md terminal-box p-6 mb-4">
        <label class="text-[9px] text-gray-500 uppercase font-bold mb-3 block italic">// PASTE CONTRACT OR SYMBOL</label>
        <div class="space-y-3">
            <input type="text" id="searchQuery" placeholder="0x... or SOL, BTC, PEPE" class="w-full bg-black border border-[#222] p-4 rounded-xl text-xs outline-none focus:border-yellow-500 transition-all font-bold text-yellow-500">
            <button onclick="processSearch()" class="w-full bg-yellow-500 text-black font-black py-4 rounded-xl text-[10px] uppercase tracking-[0.2em] btn-glow">Execute Deep Scan</button>
        </div>
    </div>

    <div id="displayArea" class="hidden w-full max-w-md space-y-4">
        
        <div class="terminal-box p-5 text-center relative overflow-hidden">
            <div id="riskBg" class="absolute inset-0 opacity-5"></div>
            <p class="text-[8px] text-gray-500 uppercase mb-2">10,000% Potential Score</p>
            <h2 id="probability" class="text-5xl font-black italic">--%</h2>
            <div id="riskLabel" class="text-[10px] mt-2 font-bold tracking-widest uppercase">---</div>
        </div>

        <div class="terminal-box p-6 border-l-4 border-yellow-500">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <p id="chainName" class="text-[9px] text-gray-500 font-bold">---</p>
                    <h3 id="fullName" class="text-xl font-black">---</h3>
                </div>
                <p id="curPrice" class="text-lg font-bold text-white">$0.00</p>
            </div>

            <div class="grid grid-cols-2 gap-4 border-t border-white/5 pt-4">
                <div>
                    <p class="text-[8px] text-gray-400 uppercase font-bold">Target 1 (200%)</p>
                    <p id="target1" class="text-xs font-bold text-green-400">---</p>
                </div>
                <div>
                    <p class="text-[8px] text-gray-400 uppercase font-bold">Moonshot (10,000%)</p>
                    <p id="target2" class="text-xs font-bold text-yellow-500">---</p>
                </div>
            </div>

            <div class="mt-4 pt-4 border-t border-white/5">
                <div class="flex justify-between items-center">
                    <p class="text-[8px] text-red-500 uppercase font-bold tracking-widest">Shield Exit (Stop Loss -45%)</p>
                    <p id="stopLoss" class="text-xs font-bold text-red-500">---</p>
                </div>
            </div>
        </div>

        <a href="https://www.bybit.com/invite?ref=Z8VPGGR" class="block w-full py-4 text-center border border-white/5 rounded-xl text-[9px] font-bold text-gray-600 hover:text-yellow-500 transition-colors">SECURE TRADE ON BYBIT HUB →</a>
    </div>

    <script>
        async function processSearch() {
            const query = document.getElementById('searchQuery').value.trim();
            if(!query) return;

            document.getElementById('displayArea').classList.remove('hidden');

            try {
                // DexScreener search is the most powerful (handles Addresses & Symbols)
                const res = await fetch(`https://api.dexscreener.com/latest/dex/search?q=${query}`);
                const data = await res.json();
                
                if(!data.pairs || data.pairs.length === 0) {
                    alert("Zero results. Please double-check the Contract Address!");
                    return;
                }

                // Get the top pair by liquidity to ensure we analyze the real one
                const bestPair = data.pairs.sort((a, b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0))[0];
                
                const price = parseFloat(bestPair.priceUsd);
                const liq = bestPair.liquidity ? bestPair.liquidity.usd : 0;
                const vol = bestPair.volume ? bestPair.volume.h24 : 0;

                // 1. UPDATE BASICS
                document.getElementById('chainName').innerText = bestPair.chainId.toUpperCase();
                document.getElementById('fullName').innerText = bestPair.baseToken.name + " (" + bestPair.baseToken.symbol + ")";
                document.getElementById('curPrice').innerText = "$" + (price < 0.0001 ? price.toFixed(10) : price.toLocaleString());

                // 2. ANALYZE PROBABILITY (Is it a moonshot or a rug?)
                let score = 0;
                if(liq > 40000) score += 25;
                if(vol > 80000) score += 35;
                if(liq > 250000) score += 20;
                if(bestPair.baseToken.address.length > 20) score += 20; // Bonus for CA check

                const probText = document.getElementById('probability');
                const label = document.getElementById('riskLabel');
                const bg = document.getElementById('riskBg');

                probText.innerText = score + "%";
                
                if(score >= 80) {
                    label.innerText = "High Conviction Moonshot";
                    label.className = "text-[10px] mt-2 font-bold tracking-widest uppercase text-green-400";
                    bg.className = "absolute inset-0 opacity-20 bg-green-500";
                } else if(score >= 40) {
                    label.innerText = "Speculative Move (Risky)";
                    label.className = "text-[10px] mt-2 font-bold tracking-widest uppercase text-yellow-500";
                    bg.className = "absolute inset-0 opacity-20 bg-yellow-500";
                } else {
                    label.innerText = "Extreme Risk / Rug Likely";
                    label.className = "text-[10px] mt-2 font-bold tracking-widest uppercase text-red-500";
                    bg.className = "absolute inset-0 opacity-20 bg-red-500";
                }

                // 3. TARGET CALCULATIONS
                const fmt = (p) => p < 0.0001 ? p.toFixed(10) : p.toLocaleString();
                document.getElementById('target1').innerText = "$" + fmt(price * 3);
                document.getElementById('target2').innerText = "$" + fmt(price * 101);
                document.getElementById('stopLoss').innerText = "$" + fmt(price * 0.55);

            } catch (err) {
                alert("Network Error. Check your connection!");
            }
        }
    </script>
</body>
</html>
